<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hold’em decision drills from the basics to river game theory, graded on your decisions, not the cards.">
<meta name="theme-color" content="#F8FAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Felt Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Felt Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one centred column; a navy felt table sits on the sage ground, the question and the feedback panels stack beneath it */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#E2E8E4; --ink:#16212B; --muted:#5B6873; --line:#CCD5D0;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --call:#86B5A6; --call-ink:#0F2A23; --cell:#E4EAE6; --hl:#D98E04; --hl-ink:#1A1200;
  --felt:#27486F; --felt-2:#1A3354; --rail:#0F1F33; --felt-ink:#EAF0F6; --felt-dim:rgba(234,240,246,.62); --felt-glass:rgba(255,255,255,.10);
  --card-bg:#FBFBF8; --c0:#1B1B1B; --c1:#C62828; --c2:#1C5FB8; --c3:#2E7D32;
  --good:#23704A; --good-bg:#DCEEE3; --ok:#875709; --ok-bg:#F4E7CC; --miss:#A3302F; --miss-bg:#F6DEDC;
  --bar:#F8FAF9; --sel:#DCE5EF; --pop-bg:#1F3A5F; --pop-ink:#FFFFFF; --pop-mut:#B9C9DC; --scrim:rgba(8,14,22,.38);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1417; --surface:#172027; --surface-2:#1E2930; --ink:#E4EAE7; --muted:#97A5AC; --line:#2B3842;
  --accent:#93B6E2; --accent-ink:#0D1A29; --call:#3F7568; --call-ink:#E8F4F0; --cell:#222D34; --hl:#F2B33D;
  --felt:#1F3D63; --felt-2:#132842; --rail:#081221; --felt-ink:#EAF0F6; --felt-dim:rgba(234,240,246,.6); --felt-glass:rgba(255,255,255,.08);
  --card-bg:#ECECE5; --c0:#1B1B1B; --c1:#C62828; --c2:#1C5FB8; --c3:#2E7D32;
  --good:#71CF99; --good-bg:#173226; --ok:#E6B45A; --ok-bg:#33280F; --miss:#F08A84; --miss-bg:#3A1A1A;
  --bar:#141B20; --sel:#22344A; --pop-bg:#DCE7F5; --pop-ink:#0D1A29; --pop-mut:#41546B; --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1417; --surface:#172027; --surface-2:#1E2930; --ink:#E4EAE7; --muted:#97A5AC; --line:#2B3842;
  --accent:#93B6E2; --accent-ink:#0D1A29; --call:#3F7568; --call-ink:#E8F4F0; --cell:#222D34; --hl:#F2B33D;
  --felt:#1F3D63; --felt-2:#132842; --rail:#081221; --felt-ink:#EAF0F6; --felt-dim:rgba(234,240,246,.6); --felt-glass:rgba(255,255,255,.08);
  --card-bg:#ECECE5; --c0:#1B1B1B; --c1:#C62828; --c2:#1C5FB8; --c3:#2E7D32;
  --good:#71CF99; --good-bg:#173226; --ok:#E6B45A; --ok-bg:#33280F; --miss:#F08A84; --miss-bg:#3A1A1A;
  --bar:#141B20; --sel:#22344A; --pop-bg:#DCE7F5; --pop-ink:#0D1A29; --pop-mut:#41546B; --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:16px calc(var(--barh,64px) + 28px);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

/* app chrome: sticky top bar, fixed bottom tab bar, and a bottom action bar that replaces the tabs inside a drill */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.appbar .in{max-width:880px;margin:0 auto;min-height:56px;display:flex;align-items:center;gap:8px;padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px))}
.mark{width:30px;height:30px;flex:none;margin-left:4px;display:block}
.ab-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.ab-title h1{font-size:25px;text-transform:uppercase;color:var(--accent);letter-spacing:.03em}
.ab-eye{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-name{font-family:var(--f-display);font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:active,.iconbtn[aria-expanded="true"]{background:var(--sel)}
.iconbtn svg{width:24px;height:24px}
.chip{font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:4px 10px;white-space:nowrap}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-user-select:none;user-select:none}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tabbar .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tabbar .pill svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] .pill{background:var(--sel)}
body.playing .tabbar{display:none}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);border-top:1px solid var(--line);padding:10px max(12px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none}
.actionbar .in{max-width:880px;margin:0 auto;display:flex;gap:8px}
.actionbar .in>.btn{flex:1 1 0;min-height:52px}
.actionbar .in>.btn.wide{flex:2 1 0}
.actionbar .row,.actionbar .grid3,.actionbar .stack{display:grid;gap:8px;width:100%}
.actionbar .row{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.actionbar .grid3{grid-template-columns:repeat(3,1fr)}
.actionbar .row .btn,.actionbar .grid3 .btn{min-height:52px;padding-inline:6px}
.actionbar .btn.long{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;text-align:left;padding:10px 14px;line-height:1.3}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45}
@media (hover:none){kbd{display:none}}
.screenhead{display:flex;flex-direction:column;gap:4px}
.screenhead h2{font-size:34px;line-height:1}
.screenhead .fmt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.drill{position:relative;padding-right:34px}
.drill .chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
#app.enter{animation:fi .22s ease-out}
#app.push{animation:push .28s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{opacity:.2;transform:translateX(32px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#app.enter,#app.push{animation:none}}

.intro{display:grid;grid-template-columns:1fr auto;gap:14px 24px;align-items:end}
.intro p{max-width:62ch;color:var(--muted)}
.intro p b{color:var(--ink)}
@media (max-width:620px){.intro{grid-template-columns:1fr}}

.level{display:grid;grid-template-columns:150px 1fr;gap:12px 20px;padding-block:16px;border-top:1px solid var(--line)}
.lvhead{display:flex;flex-direction:column;gap:2px}
.lvhead h3{font-size:24px;line-height:1.05;color:var(--ink)}
.lvhead p{font-size:14px;color:var(--muted)}
.lvhead .tagline{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.drill{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.drill:hover{border-color:var(--accent)}
.dname{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--accent)}
.dblurb{font-size:14px;color:var(--muted);line-height:1.35}
.dstat{font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px}
.meter{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:90px}
.meter i{display:block;height:100%;background:var(--accent)}
@media (max-width:620px){.level{grid-template-columns:1fr}}

.linkbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}

.felt{background:radial-gradient(ellipse at 50% 42%, var(--felt) 0%, var(--felt-2) 78%);border:10px solid var(--rail);border-radius:150px;padding:16px 24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;color:var(--felt-ink);min-height:300px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 6px 18px rgba(0,0,0,.18)}
@media (max-width:560px){.felt{border-radius:60px;border-width:7px;padding:14px 12px 16px;min-height:280px}}
.seat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.pos{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;background:var(--rail);color:var(--felt-ink);padding:3px 10px;border-radius:999px}
.act{font-family:var(--f-mono);font-size:13px;background:var(--felt-glass);padding:4px 10px;border-radius:999px;color:var(--felt-ink)}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.pot{font-family:var(--f-mono);font-size:13px;color:var(--felt-dim)}
.pot b{color:var(--felt-ink);font-weight:600;font-size:15px}
.board{display:flex;gap:6px;flex-wrap:nowrap}
.street{font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--felt-dim)}
.hole{display:flex;gap:6px}

.pc{--w:44px;width:var(--w);height:calc(var(--w)*1.38);background:var(--card-bg);border-radius:calc(var(--w)*.13);box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.25);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;line-height:.95;flex:none}
.pc .r{font-size:calc(var(--w)*.56)}
.pc .s{font-size:calc(var(--w)*.44)}
.pc.lg{--w:56px}
.pc.sm{--w:26px;box-shadow:0 0 0 1px var(--line)}
.pc.slot{background:var(--felt-glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.st0{color:var(--c0)} .st1{color:var(--c1)} .st2{color:var(--c2)} .st3{color:var(--c3)}
@media (max-width:420px){.pc{--w:40px}.pc.lg{--w:50px}}
.inl{font-family:var(--f-mono);font-weight:600;white-space:nowrap;background:var(--card-bg);border-radius:4px;padding:0 3px;box-shadow:0 0 0 1px var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ctx{max-width:68ch}
.ctl{display:flex;flex-direction:column;gap:10px}
.ctl label,.ctl .lbl{font-weight:600}
.pctrow{display:flex;align-items:center;gap:10px}
.pctrow input[type=range]{flex:1;accent-color:var(--accent);min-width:0;height:28px}
.readout{font-size:28px;min-width:4.2ch;text-align:right;color:var(--accent)}
.pctbox{display:inline-flex;align-items:baseline;gap:2px;font-size:26px;color:var(--accent);flex:none}
.pctin{width:3.4ch;font-size:26px;text-align:right;color:var(--accent);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 6px;-moz-appearance:textfield;appearance:textfield}
.pctin::-webkit-inner-spin-button,.pctin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button,.numin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pctin:focus,.numin:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.hint{font-size:13px;color:var(--muted)}
.numin{width:7ch;font-family:var(--f-mono);font-size:24px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
.btn{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sq{width:40px;height:40px;padding:0;font-size:22px;flex:none}
.ctl .btn.primary{align-self:flex-start}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices .btn{flex:1 1 120px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.55;margin-right:4px;vertical-align:2px}
.locked{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--surface-2);border-radius:8px;font-size:14px}
.locked b{font-size:15px}

.fb{gap:12px}
.fbhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;padding:2px 12px;border-radius:6px}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.miss{background:var(--miss-bg);color:var(--miss)}
.fbhead .score{color:var(--muted);font-size:14px}
.fbhead .evl{color:var(--miss);font-size:14px}
.note{max-width:68ch}
.tblwrap{overflow-x:auto}
table.cmp{border-collapse:collapse;font-size:15px;min-width:280px}
table.cmp th{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);text-align:left;padding:2px 18px 4px 0;font-weight:600}
table.cmp td{padding:5px 18px 5px 0;border-top:1px solid var(--line)}
table.cmp td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.cmp td.right{color:var(--good);font-weight:600}
.math{font-family:var(--f-mono);font-size:13px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;margin:0}
.lesson{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.lesson p{max-width:72ch}
.fbactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dealres{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.fadein{animation:fi .25s ease-out}
@keyframes fi{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fadein{animation:none}}

.gridbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;max-width:420px;width:100%;font-family:var(--f-mono);font-size:9px}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:2px;color:var(--ink);overflow:hidden;letter-spacing:-.02em}
.grid div.on{color:var(--accent-ink)}
.grid div.hi{outline:2px solid var(--hl);outline-offset:-1px;position:relative;z-index:1;font-weight:700}
@media (max-width:420px){.grid{font-size:7.5px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.comp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.comp div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.comp b{font-family:var(--f-mono);font-size:20px}
.comp span{font-size:12px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--accent)}
.tile span{font-size:13px;color:var(--muted)}
.spark{width:100%;height:auto;display:block}
.dtable{width:100%;border-collapse:collapse;font-size:14px}
.dtable th{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);text-align:left;padding:4px 10px 6px 0;font-weight:600}
.dtable td{padding:6px 10px 6px 0;border-top:1px solid var(--line);vertical-align:middle}
.dtable td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.leak{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.leak div{min-width:0;flex:1 1 240px}
.leak b{font-weight:600}
.leak p{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.rule{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.rule h3{font-size:20px;color:var(--accent)}
.rule.lockedrule h3{color:var(--muted)}
.rule p{max-width:72ch}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.play{display:flex;flex-direction:column;gap:14px}
.term{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;-webkit-user-select:text;user-select:text}
.term:hover{color:var(--accent)}

<script>
/*CORE-START*/
const R='23456789TJQKA', SU='shdc';
const RN=['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const SN=['spades','hearts','diamonds','clubs'];
const SYM=['♠','♥','♦','♣'];
const rk=c=>c>>2, su=c=>c&3;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function deck(){const d=[];for(let i=0;i<52;i++)d.push(i);return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t}return a}
const n1=x=>String(Math.round(x*10)/10);
const bb=x=>n1(x)+' bb';
const pct1=x=>(x*100).toFixed(1)+'%';
const pct0=x=>Math.round(x*100)+'%';
const sgn=x=>(x>=0?'+':'−')+n1(Math.abs(x));
const CAT=['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];

/* ---------- hand evaluator: higher score = better hand; category in bits 20+ ---------- */
const _rc=new Int8Array(13),_sc=new Int8Array(4),_sm=new Int32Array(4);
function strHigh(m){const x=(m<<1)|((m>>12)&1);for(let h=13;h>=4;h--){if(((x>>(h-4))&31)===31)return h-1}return -1}
function topBits(m,n){let out=0,c=0;for(let r=12;r>=0&&c<n;r--)if(m&(1<<r)){out=(out<<4)|r;c++}return out}
function evalCards(cs,n){
  _rc.fill(0);_sc.fill(0);_sm.fill(0);let rm=0;
  for(let i=0;i<n;i++){const c=cs[i],r=c>>2,s=c&3;_rc[r]++;_sc[s]++;_sm[s]|=1<<r;rm|=1<<r}
  let fs=-1;for(let s=0;s<4;s++)if(_sc[s]>=5)fs=s;
  if(fs>=0){const h=strHigh(_sm[fs]);if(h>=0)return (8<<20)|h}
  let q=-1,t1=-1,t2=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){const k=_rc[r];if(k===4)q=r;else if(k===3){if(t1<0)t1=r;else if(t2<0)t2=r}else if(k===2){if(p1<0)p1=r;else if(p2<0)p2=r}}
  if(q>=0){let k=0;for(let r=12;r>=0;r--)if(r!==q&&_rc[r]){k=r;break}return (7<<20)|(q<<4)|k}
  if(t1>=0&&(t2>=0||p1>=0))return (6<<20)|(t1<<4)|Math.max(t2,p1);
  if(fs>=0)return (5<<20)|topBits(_sm[fs],5);
  const sh=strHigh(rm);if(sh>=0)return (4<<20)|sh;
  if(t1>=0)return (3<<20)|(t1<<8)|topBits(rm&~(1<<t1),2);
  if(p1>=0&&p2>=0)return (2<<20)|(p1<<8)|(p2<<4)|topBits(rm&~(1<<p1)&~(1<<p2),1);
  if(p1>=0)return (1<<20)|(p1<<12)|topBits(rm&~(1<<p1),3);
  return topBits(rm,5);
}
const ev=a=>evalCards(a,a.length);
const cat=v=>v>>20;

/* ---------- ranges ---------- */
function keyOf(r1,r2,suited){const hi=Math.max(r1,r2),lo=Math.min(r1,r2);if(hi===lo)return R[hi]+R[lo];return R[hi]+R[lo]+(suited?'s':'o')}
const handKey=(a,b)=>keyOf(rk(a),rk(b),su(a)===su(b));
function gridKey(i,j){return i===j?R[i]+R[j]:i>j?R[i]+R[j]+'s':R[j]+R[i]+'o'}
function combosOf(key){
  const a=R.indexOf(key[0]),b=R.indexOf(key[1]),o=[];
  if(a===b){for(let s=0;s<4;s++)for(let t=s+1;t<4;t++)o.push([a*4+s,a*4+t])}
  else if(key[2]==='s'){for(let s=0;s<4;s++)o.push([a*4+s,b*4+s])}
  else{for(let s=0;s<4;s++)for(let t=0;t<4;t++)if(s!==t)o.push([a*4+s,b*4+t])}
  return o;
}
function expandTok(t){
  const ri=ch=>R.indexOf(ch);
  if(t.includes('-')){
    const [a,b]=t.split('-');
    if(a[0]===a[1]){let x=ri(a[0]),y=ri(b[0]);if(x<y)[x,y]=[y,x];const o=[];for(let r=y;r<=x;r++)o.push(R[r]+R[r]);return o}
    const suf=a[2];
    if(a[0]===b[0]){let x=ri(a[1]),y=ri(b[1]);if(x<y)[x,y]=[y,x];const o=[];for(let r=y;r<=x;r++)o.push(a[0]+R[r]+suf);return o}
    const gap=ri(a[0])-ri(a[1]);let x=ri(a[0]),y=ri(b[0]);if(x<y)[x,y]=[y,x];const o=[];for(let r=y;r<=x;r++)o.push(R[r]+R[r-gap]+suf);return o;
  }
  if(t.endsWith('+')){
    const b=t.slice(0,-1);
    if(b[0]===b[1]){const o=[];for(let r=ri(b[0]);r<=12;r++)o.push(R[r]+R[r]);return o}
    const hi=ri(b[0]),o=[];for(let r=ri(b[1]);r<hi;r++)o.push(b[0]+R[r]+b[2]);return o;
  }
  return [t];
}
function parseRange(str){
  const m=new Map();
  for(let tok of str.split(',')){tok=tok.trim();if(!tok)continue;let w=1;const ci=tok.indexOf(':');if(ci>=0){w=parseFloat(tok.slice(ci+1));tok=tok.slice(0,ci)}for(const k of expandTok(tok))m.set(k,w)}
  return m;
}
function rangePct(map){let s=0;for(const [k,w] of map)s+=w*combosOf(k).length;return s/1326}
function comboList(map,dead){const o=[];for(const [k,w] of map){if(w<=0)continue;for(const [a,b] of combosOf(k)){if(dead&&(dead[a]||dead[b]))continue;o.push([a,b,w])}}return o}
function deadOf(cards){const d=new Uint8Array(52);for(const c of cards)d[c]=1;return d}
function makeSampler(list){const cum=new Float64Array(list.length);let t=0;for(let i=0;i<list.length;i++){t+=list[i][2];cum[i]=t}return {list,cum,total:t}}
function sampleC(sp,used){
  if(!sp.total)return null;
  for(let k=0;k<300;k++){const x=Math.random()*sp.total;let lo=0,hi=sp.cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(sp.cum[m]<x)lo=m+1;else hi=m}const c=sp.list[lo];if(!used[c[0]]&&!used[c[1]])return c}
  return null;
}
/* Monte Carlo equity of range A vs range B (a single hand is a one-combo range) on a partial board */
function rvr(listA,listB,board,iters){
  const dead=deadOf(board);
  const A=makeSampler(listA.filter(x=>!dead[x[0]]&&!dead[x[1]])),B=makeSampler(listB.filter(x=>!dead[x[0]]&&!dead[x[1]]));
  const used=new Uint8Array(52),ha=new Int32Array(7),hb=new Int32Array(7);
  let w=0,t=0,n=0;
  for(let it=0;it<iters;it++){
    used.set(dead);
    const a=sampleC(A,used);if(!a)continue;used[a[0]]=1;used[a[1]]=1;
    const b=sampleC(B,used);if(!b)continue;used[b[0]]=1;used[b[1]]=1;
    ha[0]=a[0];ha[1]=a[1];hb[0]=b[0];hb[1]=b[1];
    for(let k=0;k<5;k++){let c;if(k<board.length)c=board[k];else{do{c=rnd(52)}while(used[c]);used[c]=1}ha[2+k]=c;hb[2+k]=c}
    const x=evalCards(ha,7),y=evalCards(hb,7);if(x>y)w++;else if(x===y)t++;n++;
  }
  return n?(w+t/2)/n:0.5;
}
/* exact equity of a hand vs weighted groups of combos on a 4-card board (enumerates every river) */
function exactTurnGroups(hero,groups,board){
  const dead=deadOf([...hero,...board]);const out={};let W=0,E=0;
  const h=new Int32Array(7),v=new Int32Array(7);
  h[0]=hero[0];h[1]=hero[1];for(let k=0;k<4;k++){h[2+k]=board[k];v[2+k]=board[k]}
  for(const g in groups){
    let gw=0,ge=0;
    for(const [a,b,w] of groups[g]){
      if(dead[a]||dead[b])continue;let s=0,n=0;v[0]=a;v[1]=b;
      for(let r=0;r<52;r++){if(dead[r]||r===a||r===b)continue;h[6]=r;v[6]=r;const x=evalCards(h,7),y=evalCards(v,7);s+=x>y?1:x===y?0.5:0;n++}
      gw+=w;ge+=w*s/n;
    }
    out[g]={w:gw,eq:gw?ge/gw:0};W+=gw;E+=ge;
  }
  out.total={w:W,eq:W?E/W:0};return out;
}
/* outs = unseen cards that lift the hand to a straight or better, with the hole cards playing */
function outsList(hole,board){
  const base=[...hole,...board];if(cat(ev(base))>=4)return null;
  const dead=deadOf(base),res=[],arr=[...base,0],barr=[...board,0];
  for(let c=0;c<52;c++){if(dead[c])continue;arr[arr.length-1]=c;const v=ev(arr);if(cat(v)<4)continue;barr[barr.length-1]=c;if(v>ev(barr))res.push(c)}
  return res;
}
function rankMask(cs){let m=0;for(const c of cs)m|=1<<rk(c);return m}
function drawName(hole,board,outs){
  const all=[...hole,...board];let fd=false;
  for(let s=0;s<4;s++){if(all.filter(c=>su(c)===s).length===4&&hole.some(c=>su(c)===s))fd=true}
  const m=rankMask(all),sr=new Set();
  if(strHigh(m)<0)for(const c of outs){if(strHigh(m|(1<<rk(c)))>=0)sr.add(rk(c))}
  const p=[];if(fd)p.push('flush draw');if(sr.size>=2)p.push('open-ended straight draw');else if(sr.size===1)p.push('gutshot straight draw');
  return p.join(' + ')||'draw';
}
function strengthInfo(hole,board){
  const v=ev([...hole,...board]),c=cat(v),bc=cat(ev(board));
  const br=board.map(rk),top=Math.max(...br),h1=rk(hole[0]),h2=rk(hole[1]),pp=h1===h2;
  let strong=false;
  if(c>=4)strong=true;
  else if(c===3||c===6||c===7)strong=c>bc;
  else if(c===2)strong=!pp&&br.includes(h1)&&br.includes(h2);
  const tp=strong||(pp&&h1>top)||h1===top||h2===top;
  return {cat:c,strong,tp};
}
function madeLabel(hole,board){
  const c=cat(ev([...hole,...board])),br=board.map(rk),srt=[...new Set(br)].sort((a,b)=>b-a),h1=rk(hole[0]),h2=rk(hole[1]);
  if(c>=2){if(c===3&&h1===h2&&br.includes(h1))return 'a set';const si=strengthInfo(hole,board);if(c===2&&!si.strong)return h1===h2&&h1>srt[0]?'an overpair (board paired)':'a pair plus the board pair';return 'a '+CAT[c].toLowerCase()}
  if(c===1){
    if(h1===h2){return h1>srt[0]?'an overpair':h1<srt[srt.length-1]?'an underpair':'a middle pocket pair'}
    const pr=br.includes(h1)?h1:br.includes(h2)?h2:-1;
    if(pr<0)return 'no pair (the pair is on the board)';
    const idx=srt.indexOf(pr);return idx===0?'top pair':idx===1?'second pair':'a low pair';
  }
  return 'no pair';
}
function streetName(n){return n===0?'Preflop':n===3?'Flop':n===4?'Turn':'River'}
function textureText(board){
  const rs=board.map(rk).sort((a,b)=>b-a),ns=new Set(board.map(su)).size,paired=new Set(rs).size<3,span=rs[0]-rs[2],p=[];
  p.push(RN[rs[0]]+'-high');if(paired)p.push('paired');
  p.push(ns===1?'monotone (all one suit)':ns===2?'two-tone (flush draws possible)':'rainbow (three suits)');
  if(!paired&&span<=4)p.push('connected (many straight draws)');else if(!paired&&span>=8&&rs[1]-rs[2]>=3)p.push('disconnected');
  return p.join(', ');
}
function genDraw(nb){
  for(let t=0;t<30000;t++){
    const d=shuffle(deck()),hole=[d[0],d[1]],board=d.slice(2,2+nb);
    if(cat(ev([...hole,...board]))!==0)continue;
    const ol=outsList(hole,board);if(!ol)continue;const o=ol.length;
    if(o<4||o>15)continue;if(o<8&&Math.random()<0.5)continue;
    return {hole,board,outs:ol,name:drawName(hole,board,ol)};
  }
  return null;
}
const byRiver=o=>1-(47-o)*(46-o)/(47*46);

/* ---------- approximate solver-style charts: 6-max, 100 bb, 2.5 bb opens, no ante ---------- */
const RFI_SRC={
  UTG:'22+, A2s+, K9s+, Q9s+, J9s+, T9s, 98s:0.7, 87s:0.4, 76s:0.3, ATo+, KJo+, QJo:0.4',
  HJ:'22+, A2s+, K8s+, K7s:0.5, Q9s+, J9s+, T8s+, 98s, 97s:0.5, 87s, 76s, 65s:0.5, ATo+, A9o:0.5, KJo+, KTo:0.5, QJo',
  CO:'22+, A2s+, K5s+, K4s:0.5, Q8s+, Q7s:0.5, J8s+, T8s+, 97s+, 86s+, 76s, 75s:0.5, 65s, 54s, A8o+, A7o:0.5, A5o:0.5, KTo+, K9o:0.5, QTo+, JTo, T9o:0.5',
  BTN:'22+, A2s+, K2s+, Q2s+, J5s+, J4s:0.5, T6s+, 95s+, 85s+, 75s+, 74s:0.5, 64s+, 53s+, 43s:0.5, A2o+, K8o+, K7o:0.5, Q9o+, Q8o:0.5, J8o+, T8o+, 98o, 87o:0.3',
  SB:'22+, A2s+, K2s+, Q5s+, J7s+, T7s+, 96s+, 86s+, 75s+, 65s, 64s:0.5, 54s, A2o+, K8o+, K7o:0.5, Q9o+, J9o+, T9o, T8o:0.5, 98o, 87o:0.3'
};
const RFI={};for(const p in RFI_SRC)RFI[p]=parseRange(RFI_SRC[p]);
const POSNAME={UTG:'first seat (UTG, under the gun)',HJ:'hijack (HJ)',CO:'cutoff (CO)',BTN:'button (BTN)',SB:'small blind (SB)',BB:'big blind (BB)'};
const FACING_SRC={
  'BB vs BTN':{hero:'BB',opener:'BTN',r:'QQ+, JJ:0.6, TT:0.4, AQs+, AJs:0.5, ATs:0.3, A5s:0.7, A4s:0.7, A3s:0.4, KQs:0.5, KJs:0.4, K9s:0.3, K5s:0.3, Q9s:0.3, Q6s:0.2, J9s:0.3, T8s:0.3, 97s:0.3, 86s:0.3, 75s:0.3, 65s:0.3, 54s:0.3, AKo, AQo:0.5, AJo:0.3, KQo:0.3',
    c:'22-TT, JJ, A2s-AJs, K2s-KQs, Q2s-QJs, J4s-JTs, T5s-T9s, 95s-98s, 84s-87s, 74s-76s, 63s-65s, 52s-54s, 42s-43s, 32s:0.5, A2o-AQo, K5o-KQo, Q8o-QJo, J8o-JTo, T8o-T9o, 97o-98o, 87o, 76o:0.6, 65o:0.4'},
  'BB vs CO':{hero:'BB',opener:'CO',r:'QQ+, JJ:0.5, AKs, AQs, AJs:0.4, A5s:0.6, A4s:0.5, KQs:0.4, K9s:0.2, T9s:0.2, 76s:0.2, AKo, AQo:0.4',
    c:'22-JJ, A2s-AJs, K2s-KQs, Q5s-QJs, J6s-JTs, T6s-T9s, 95s-98s, 85s-87s, 74s-76s, 63s-65s, 53s-54s, 43s:0.5, A2o-AQo, K9o-KQo, Q9o-QJo, J9o-JTo, T9o, 98o:0.5, 87o:0.3'},

D('drawcall',{level:1,name:'Chase or fold',blurb:'Your draw against a bet: is the price right?',gen(){

  let B,e,ctx;

  else{B=Math.round(P*pick([.5,.75,1,1.25,1.5])*2)/2;e=byRiver(o);ctx=`On the flop villain moves all-in for <b>${bb(B)}</b> into <b>${bb(P)}</b>, so you see both turn and river. Assume you win only if you hit your draw.`}

    steps:[{kind:'choice',key:'c',label:'Your move',options:[['call','Call'],['fold','Fold']]}],

function genMatchup(){
  for(let t=0;t<200;t++){
    const T=rnd(6);let A,B,label;const sd=()=>Math.random()<0.4;
    const mk=(r1,r2,s)=>{const s1=rnd(4);if(r1===r2){let s2=(s1+1+rnd(3))%4;return [r1*4+s1,r2*4+s2]}return [r1*4+s1,r2*4+(s?s1:(s1+1+rnd(3))%4)]};
    if(T===0){const p=rnd(10),a=p+1+rnd(12-p),b=p+1+rnd(12-p);if(a===b)continue;A=mk(p,p);B=mk(a,b,sd());label='Pair vs two overcards'}
    else if(T===1){const a=1+rnd(12),b=rnd(a);A=mk(a,a);B=mk(b,b);label='Overpair vs underpair'}
    else if(T===2){const h=8+rnd(5),k1=1+rnd(h-1),k2=rnd(k1);A=mk(h,k1,sd());B=mk(h,k2,sd());label='Dominated hand (same high card, worse kicker)'}
    else if(T===3){const a=3+rnd(10),b=2+rnd(a-2),c=1+rnd(b-1),d=rnd(c);A=mk(a,b,sd());B=mk(c,d,sd());label='Two overcards vs two undercards'}
    else if(T===4){const p=2+rnd(9),o=p+1+rnd(12-p),u=rnd(p);A=mk(p,p);B=mk(o,u,sd());label='Pair vs one overcard and one undercard'}
    else{const p=8+rnd(5),c=2+rnd(p-3);A=mk(p,p);B=mk(c,c-1,true);label='Big pair vs suited connector'}
    const all=[...A,...B];if(new Set(all).size<4)continue;
    if(Math.random()<0.5)return {hero:B,vill:A,label};return {hero:A,vill:B,label};
  }
}

const CBET_OPTS=[['small','Bet small (about ⅓ pot) with most of my range'],['mixed','Mix: bet about half my range, medium-to-large size'],['check','Check most hands; bet big only with strong hands and draws']];
/* plan from board texture, following the patterns solvers show for button vs big blind, single-raised pot, 100 bb */
function cbetClass(board){
  const rs=[...new Set(board.map(rk))].sort((a,b)=>b-a),ns=new Set(board.map(su)).size,top=rs[0];
  if(rs.length<3)return ['small','Paired flop: the caller rarely has trips, so bet small with almost everything.'];
  const span=top-rs[2];
  if(ns===1)return ['mixed','Monotone flop: many hands are vulnerable and the caller holds plenty of flushes, so bet less often, mostly small.'];
  if(rs[2]>=8)return ['mixed','Three broadway cards: both ranges connect, so bet about half the time with mixed sizes.'];
  if(top>=11)return ['small','Ace- or king-high: the raiser has far more top pairs and big pairs. Bet small with most of the range.'];
  if(span<=4&&top<=9)return ['check','Connected cards, jack-high or lower, hit the caller’s suited connectors and small pairs: check most hands, bet big with strong hands and draws.'];
  if(span<=4)return ['mixed','Queen-high and connected: both ranges have straights and two pairs, so mix.'];
  if(top>=8)return ['small','Dry, disconnected flop with a ten or higher on top: the raiser has more overpairs and top pairs. Bet small, often.'];
  return ['mixed','Low and dry: the raiser keeps the overpairs, but the caller has more small pairs and two pairs, so bet about half the time.'];
}

    steps:[{kind:'pct',key:'b',label:'Share of his bets that are bluffs',init:30},{kind:'choice',key:'c',label:'Your move',options:[['call','Call'],['fold','Fold']]}],
    evaluate(a){const err=a.b-sh*100,se=pctScore(err,3,7),call=a.c==='call',dc=decide(evc,call,0.03*(P+B)),lk=estLeak(err,7,'catch');
      if(dc.s<1)lk.push(call?'hero-call':'hero-fold');
      return {score:0.4*se+0.6*dc.s,estErr:err,evLoss:dc.loss,plain:`About ${pct0(sh)} of his bets are bluffs, and calling needs ${pct0(need)}, so ${evc>0?'call':'fold'}.`,rows:[['Bluff share',a.b+'%',pct1(sh)],['Move',call?'Call':'Fold',evc>0?'Call':'Fold']],
        note:dc.close?'Close to break-even: either choice costs little.':'',
        math:`Bluffs: ${miss} × ${k[0]}/${k[1]} = ${n1(bl)} combos; value ${Vc}\nBluff share = ${n1(bl)} ÷ (${Vc} + ${n1(bl)}) = ${pct1(sh)}\nNeeded to call: ${n1(B)} ÷ (${n1(P)} + 2 × ${n1(B)}) = ${pct1(need)}\nEV of calling = ${pct1(sh)} × ${n1(P+B)} − ${pct1(1-sh)} × ${n1(B)} = ${sgn(evc)} bb`,leaks:lk}}};
}});

const LESSONS={
  hands:{t:'Hand rankings',s:'Best to worst: straight flush, four of a kind, full house, flush, straight, three of a kind, two pair, pair, high card. Same type? The higher cards win.',

  risk:{t:'Risk against reward',s:'A call risks your call to win the pot plus his bet. Risk ÷ (risk + reward) is the share of the time you must win.',
    b:'Every call is a trade. You risk the amount you call; you can win everything already in the pot plus his bet. If you risk 5 to win 15, you break even by winning 5 times out of every 20 chips at stake: 25%. That share is the "price" of the call, and it is the number most poker decisions are measured against.'},
  seats:{t:'Seats and position',s:'Before the flop: UTG, HJ, CO, BTN, SB, BB. After the flop: SB first, BTN last. Acting last is an advantage, so play more hands near the button.',
    b:'The button (the dealer disc) moves one seat clockwise each hand, and the seat names follow it. Before the flop the order is UTG, HJ, CO, BTN, SB, BB; after the flop the small blind acts first and the button last. Acting last means you see everyone else’s choice before making yours, so good players play more hands the closer they sit to the button.'},
  potodds:{t:'The price of a call',s:'Break-even equity = bet ÷ (pot + 2 × bet). ⅓ pot → 20%, ½ → 25%, ⅔ → 29%, pot → 33%, 2× → 40%.',
    b:'Break-even equity = bet ÷ (pot + 2 × bet). The "2 × bet" is his bet plus your call: the final pot you are playing for. Learn the common sizes by heart: ¼ pot → 17%, ⅓ → 20%, ½ → 25%, ⅔ → 29%, ¾ → 30%, pot → 33%, 1.5× → 38%, 2× → 40%. Bigger bets push the price up, but slowly: doubling from pot to 2× pot only moves it from 33% to 40%.'},
  outs:{t:'Rule of 2 and 4',s:'Flop, seeing both cards: outs × 4 (subtract outs − 8 above 8 outs). One card to come: outs × 2.',
    b:'Outs are unseen cards that complete your hand. On the flop, if you will see both cards (an all-in), outs × 4 ≈ % to hit by the river; above 8 outs subtract (outs − 8). With one card to come, outs × 2 (exactly outs ÷ 46 on the turn). Common counts: flush draw 9, open-ended straight draw 8, gutshot 4, flush draw + open-ender 15, flush draw + gutshot 12.'},
  drawcall:{t:'Draws against bets',s:'A turn flush draw has ≈ 20%: enough vs a ⅓-pot bet, not vs ½ pot. All-in on the flop it has ≈ 35% and can call a pot-sized shove.',
    b:'Compare your outs-based equity with the price. With one card to come a flush draw has about 20% (9 ÷ 46): enough against a ⅓-pot bet (needs 20%), not against ½ pot (needs 25%) unless you will win more when you hit (see Implied odds). All-in on the flop, the same draw has about 35% and can call a pot-sized shove (needs 33%).'},
  matchups:{t:'Preflop benchmarks',s:'Pair vs two overs ≈ 55%; overpair vs underpair ≈ 80%; dominated hand ≈ 25–30%; two overs vs two unders ≈ 60–65%.',
    b:'All-in preflop, hand against hand: pair vs two overcards ≈ 55/45; overpair vs underpair ≈ 80/20; a dominated hand (AQ vs AK: same high card, worse kicker) has only 25–30%; two overcards vs two undercards ≈ 60–65%; pair vs one overcard and one undercard ≈ 70%; a suited connector vs a big pair ≈ 20–23%. Being suited adds about 2–3 points.'},
  shove:{t:'Calling a shove',s:'In the BB the price is (stack − 1) ÷ (2 × stack + 0.5): ≈ 44% vs 10 bb, 46% vs 15 bb, 47% vs 20 bb. Compare with equity vs his whole range.',
    b:'Against an all-in, the only question is whether your equity against his whole range beats the price. In the big blind your 1 bb is already in, so the price is (stack − 1) ÷ (2 × stack + 0.5): about 44% against 10 bb, 46% against 15 bb, 47% against 20 bb. The wider he shoves, the more hands can call. Weak aces suffer against ranges full of better aces; small pairs do better than they look.'},
  turnjam:{t:'Split his range',s:'Value, draws, bluffs: one pair beats bluffs, is ≈ 75–80% vs draws and near zero vs value. The mix decides.',
    b:'Split his range into value, draws and bluffs, and ask how you do against each part. One pair usually beats the bluffs, has about 75–80% against a draw with one card to come, and has almost nothing against value. So the decision turns on how many draws and bluffs are really in there: against a tight player with few draws and no bluffs, fold your one pair.'},
  rfi:{t:'Opening ranges widen towards the button',s:'Fewer players behind = wider opens. In these charts: UTG 19%, HJ 22%, CO 30%, BTN 48%, SB 43% of hands.',
    b:'Open-raise ranges widen as you get closer to the button, because fewer players are left to wake up with a big hand and you will more often play the pot in position. Suited hands and pairs play well; weak offsuit aces and kings are the first hands to drop out from early seats. These charts are approximations of published solver output for 6-max, 100 bb, 2.5 bb opens.'},
  facing:{t:'Defending against opens',s:'The BB defends very wide (call 1.5 to win 5.5 needs ≈ 27%). The SB mostly 3-bets or folds vs a button open.',
    b:'The big blind defends very wide because 1 bb is already in and nobody acts after it: calling 1.5 bb to win a 5.5 bb pot needs only about 27%. Against a button open it continues with about 55% of hands; against UTG, about a quarter. The small blind mostly 3-bets or folds against the button, because calling out of position with the big blind still to act is costly. A 3-bet (re-raise) range mixes value hands with suited hands such as A5s, which block aces and play well when called.'},
  mdf:{t:'Minimum defence frequency',s:'Continue with at least pot ÷ (pot + bet) of your range: ½ pot → 67%, pot → 50%, 2× pot → 33%.',
    b:'Minimum defence frequency (MDF) = pot ÷ (pot + bet): the share of your range you must continue with so that a bluff with any two cards cannot show a profit. Against ½ pot that is 67%, against pot 50%, against 2× pot 33%. It is a guide for unknown opponents: against players who rarely bluff, fold more.'},
  bluffbe:{t:'What a bluff needs',s:'Folds needed = bet ÷ (pot + bet): ⅓ pot → 25%, ½ → 33%, pot → 50%, 2× → 67%.',
    b:'A bluff of B into a pot of P needs folds B ÷ (P + B) of the time: ⅓ pot → 25%, ½ pot → 33%, ⅔ → 40%, pot → 50%, 2× → 67%. Small bluffs need fewer folds, but players also fold less often to them.'},
  implied:{t:'Implied odds',s:'Extra needed when you hit = bet ÷ equity − pot − 2 × bet. A turn flush draw vs a pot-sized bet needs ≈ 2× the pot extra.',
    b:'When the price is too high, ask how much more you would need to win later when you hit: extra = bet ÷ equity − pot − 2 × bet. A turn flush draw (about 20%) facing a pot-sized bet needs about twice the pot extra on the river, which is rarely paid. Gutshots almost never qualify against big bets. Draws to the best possible hand, against opponents who pay off, do best.'},
  cbet:{t:'Range advantage sets frequency, nut advantage sets size',s:'Ace- and king-high dry flops favour the raiser: bet small, often. Low connected flops favour the caller: check more.',
    b:'Range advantage (whose whole range has more equity on this flop) sets how often you bet; nut advantage (who holds more of the very strongest hands) sets how big. The preflop raiser has more big cards, so ace- and king-high dry flops favour them: bet small with most of the range. Low, connected flops hit the big blind’s calling range: check more, and bet bigger when you do bet. This drill’s answers are a heuristic built from solver patterns, computed live from the two ranges.'},
  defend:{t:'Defending against small c-bets',s:'A ⅓-pot bet needs 20%. Out of position, count about 80% of your raw equity, then compare.',
    b:'Against a ⅓-pot c-bet you need only 20% raw equity, but out of position you will not realise all of it, because you can be bet off your hand later. A working rule: count about 80% of your equity. Defend most pairs, draws and overcards with backup draws; fold the bottom of your range; raise your strongest hands (two pair or better) and some strong draws.'},
  polar:{t:'Balanced bluffing',s:'Bluffs per value hand = bet ÷ (pot + bet): ½ pot → 1 for 3, pot → 1 for 2, 2× pot → 2 for 3.',
    b:'With a polarised range (very strong or nothing), bluff so that bluffs make up bet ÷ (pot + 2 × bet) of your bets: exactly the caller’s break-even price. Per value combo that is bet ÷ (pot + bet) bluffs: ½ pot → 1 for 3, pot → 1 for 2, 2× pot → 2 for 3. Bigger bets earn more bluffs. Over-bluff and a good player calls everything; under-bluff and they fold everything but their best hands.'},
  catch:{t:'Counting bluffs',s:'Call a bluff-catcher when bluffs are at least bet ÷ (pot + 2 × bet) of his bets. No missed draws = few bluffs.',
    b:'Count his betting range. Value combos are easy to list; bluffs come mostly from missed draws. Call a bluff-catcher when bluffs make up at least bet ÷ (pot + 2 × bet) of his bets. If no draws missed on the river, his bluffs mostly vanish: fold more. Many low-stakes players bluff rivers far less than the balanced amount.'}
};

  {id:'MDF',t:'Minimum defence frequency (MDF)',c:4,a:['minimum defence frequency','minimum defence'],A:['MDF'],d:'The smallest share of your hands you must keep playing against a bet, so that his bluffs do not profit automatically. Fold more than this and he can bet with any two cards.'},
  {id:'realise',t:'Realising equity',c:4,a:['realise','realisation','realised'],d:'Actually collecting your share of the pot. When you act first you are often pushed off your hand before the river, so you collect less than your raw equity.'},
  {id:'range',t:'Range',c:5,a:['range','ranges'],d:'All the hands a player could have, given how they have played so far. Thinking "he has one of these 200 combos" beats guessing one exact hand.'},
  {id:'polarised',t:'Polarised',c:5,a:['polarised','polarized'],d:'A range made of very strong hands and weak ones, with nothing in between.'},

const INTRO={

const LSKEY='feltlab.v1';
function freshState(){return {v:1,drills:{},leaks:{},log:[],seen:{}}}
function loadLocal(){try{const s=localStorage.getItem(LSKEY);const o=s?JSON.parse(s):null;return o&&o.v===1?o:null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(e){}}
let state=loadLocal()||freshState();
let remote=null,saveTimer=null,saving=false,dirty=false;
const totalN=s=>Object.values((s&&s.drills)||{}).reduce((a,d)=>a+(d.n||0),0);
let syncText='Progress is saved on this device.';
function setSync(t){syncText=t;const el=document.getElementById('sync');if(el)el.textContent=t}
function queueSave(){saveLocal();if(!remote)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
async function flush(){
  if(!remote||saving||!dirty)return;saving=true;dirty=false;
  try{await remote.set(JSON.parse(JSON.stringify(state)))}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted')dirty=true;else{remote=null;setSync('Progress is saved on this device only.')}}
  saving=false;if(dirty&&remote)saveTimer=setTimeout(flush,4000);
}
async function initRemote(){
  const cl=window.claude;if(!cl||typeof cl.use!=='function')return;
  try{
    const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/progress'),snap=await ref.get();
    const r=snap.exists?snap.data():null;
    if(r&&r.v===1&&totalN(r)>totalN(state)){state=JSON.parse(JSON.stringify(r));saveLocal();if(!cur)render()}
    remote=ref;setSync('Progress is saved to your account and follows you across devices.');
    if(totalN(state)>totalN(r)){dirty=true;flush()}
  }catch(e){}
}
function recordResult(id,fb){
  const d=state.drills[id]||(state.drills[id]={n:0,sum:0,recent:[],ev:0,evN:0,estN:0,estAbs:0,estSig:0});
  d.n++;d.sum+=fb.score;d.recent.push(Math.round(fb.score*100)/100);if(d.recent.length>20)d.recent.shift();
  if(fb.evLoss!=null){d.ev+=fb.evLoss;d.evN++}
  if(fb.estErr!=null){d.estN++;d.estAbs+=Math.abs(fb.estErr);d.estSig+=fb.estErr}
  for(const t in state.leaks){const L=state.leaks[t];if(L.d===id)L.s=Math.round(L.s*0.85*1000)/1000}
  for(const t of fb.leaks||[]){const L=state.leaks[t]||(state.leaks[t]={s:0,n:0,d:id});L.s+=1;L.n++;L.d=id}
  for(const t in state.leaks)if(state.leaks[t].s<0.05)delete state.leaks[t];
  state.log.push({t:Date.now(),d:id,s:Math.round(fb.score*100)});if(state.log.length>400)state.log.splice(0,state.log.length-400);
  state.seen[id]=1;queueSave();
}

const SKIP='.pc,kbd,button,.term,.inl,svg,.grid,input,textarea,select,.math,.gpop,dt,dd,.noterm';
function annotate(root){
  if(!glossOn||!root)return;const used=new Set(),nodes=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest(SKIP))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  while(w.nextNode())nodes.push(w.currentNode);
  for(const node of nodes){
    const text=node.nodeValue,frag=document.createDocumentFragment();let pos=0,changed=false;
    for(;;){
      RE_CI.lastIndex=pos;RE_CS.lastIndex=pos;const m1=RE_CI.exec(text),m2=RE_CS.exec(text),c=[];
      if(m1)c.push([m1,MAP_CI[m1[1].toLowerCase()]]);if(m2)c.push([m2,MAP_CS[m2[1]]]);if(!c.length)break;
      c.sort((a,b)=>a[0].index-b[0].index||b[0][1].length-a[0][1].length);const [m,id]=c[0],end=m.index+m[1].length;
      if(used.has(id)){frag.appendChild(document.createTextNode(text.slice(pos,end)));pos=end;continue}
      used.add(id);changed=true;frag.appendChild(document.createTextNode(text.slice(pos,m.index)));
      const b=document.createElement('button');b.type='button';b.className='term';b.dataset.g=id;b.textContent=m[1];b.setAttribute('aria-label',m[1]+': explain');pos=end;
      if(/[?.,;:!)]/.test(text[end]||'')){const sp=document.createElement('span');sp.style.whiteSpace='nowrap';sp.append(b,text[end]);frag.appendChild(sp);pos=end+1}else frag.appendChild(b);
    }
    if(changed){frag.appendChild(document.createTextNode(text.slice(pos)));node.parentNode.replaceChild(frag,node)}
  }
}

function pickMix(){
  const ids=Object.keys(DRILLS),w=ids.map(id=>{const d=state.drills[id];if(!d||d.n<3)return 2;return 0.5+3*(1-avgRecent(d))});

}

  sc.steps.forEach((st,i)=>{
    if(i<cur.step)h+=`<div class="locked"><span>${st.label}</span><b class="mono">${fmtAns(st,cur.answers[st.key])}</b></div>`;
    else if(i===cur.step&&!cur.done){
      if(st.kind==='pct')h+=`<div class="ctl"><label for="ctl-pcttxt">${st.label}</label><div class="pctrow"><button class="btn sq" data-adj="-1" aria-label="Lower">−</button><input type="range" id="ctl-pct" min="0" max="100" step="1" value="${st.init}" aria-label="Slide to set the percentage"><button class="btn sq" data-adj="1" aria-label="Higher">+</button><span class="pctbox"><input class="pctin mono" type="number" id="ctl-pcttxt" inputmode="numeric" min="0" max="100" step="1" value="${st.init}"><span class="mono">%</span></span></div><span class="hint">Type a number or use the slider</span></div>`;
      else if(st.kind==='num')h+=`<div class="ctl"><label for="ctl-num">${st.label}</label><div class="pctrow"><button class="btn sq" data-adj="-1" aria-label="Fewer">−</button><input class="numin" type="number" id="ctl-num" inputmode="numeric" min="${st.min}" max="${st.max}" step="${st.step}" value="${st.init}"><button class="btn sq" data-adj="1" aria-label="More">+</button></div></div>`;
      else h+=`<div class="ctl"><div class="lbl">${st.label} <span class="muted" style="font-weight:400">· choose below</span></div></div>`;
    }
  });
  const el=$('#steps');el.innerHTML=h;annotate(el);
  const rg=el.querySelector('#ctl-pct'),txt=el.querySelector('#ctl-pcttxt'),num=el.querySelector('#ctl-num');
  if(rg){
    rg.addEventListener('input',()=>{txt.value=rg.value});
    txt.addEventListener('input',()=>{const v=Number(txt.value);if(txt.value!==''&&isFinite(v))rg.value=clamp(Math.round(v),0,100)});
    txt.addEventListener('focus',()=>txt.select());
  }
  if(num)num.addEventListener('focus',()=>num.select());
  el.querySelectorAll('[data-adj]').forEach(b=>b.addEventListener('click',()=>{const st=cur.sc.steps[cur.step];
    if(rg){const v=clamp((Number(txt.value)||0)+Number(b.dataset.adj),0,100);rg.value=v;txt.value=v}
    else num.value=clamp(Number(num.value)+Number(b.dataset.adj),st.min,st.max)}));
}
function renderBar(){
  if(!cur){actionbar.hidden=true;actionbar.innerHTML='';document.body.classList.remove('playing');setBarH();return}
  document.body.classList.add('playing');actionbar.hidden=false;let h;
  if(cur.done)h=`${cur.sc.dealOut?`<button class="btn" id="deal" ${cur.dealt?'disabled':''}>Deal it out</button>`:''}<button class="btn primary wide" id="next">Next hand <kbd>↵</kbd></button>`;
  else{const st=cur.sc.steps[cur.step];
    if(st.kind==='choice'){const long=st.options.some(o=>o[1].length>22),cls=long?'stack':st.options.length>3?'grid3':'row';
      h=`<div class="${cls}">${st.options.map((o,j)=>`<button class="btn choice ${long?'long':''}" data-v="${o[0]}"><kbd>${j+1}</kbd>${o[1]}</button>`).join('')}</div>`}
    else h=`<button class="btn primary wide" id="lock">Lock in <kbd>↵</kbd></button>`}
  actionbar.innerHTML=`<div class="in">${h}</div>`;
  const q=s=>actionbar.querySelector(s);
  if(q('#lock'))q('#lock').addEventListener('click',lockStep);
  actionbar.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.v)));
  if(q('#next'))q('#next').addEventListener('click',()=>nextHand());
  if(q('#deal'))q('#deal').addEventListener('click',()=>{try{$('#dealres').innerHTML=cur.sc.dealOut()+' <span>How the cards fell does not change your grade.</span>';$('#dealres').scrollIntoView({block:'nearest'})}catch(e){}cur.dealt=true;q('#deal').disabled=true});
  setBarH();
}
function lockStep(){
  const st=cur.sc.steps[cur.step];
  if(st.kind==='pct'){const t=$('#ctl-pcttxt');let v=Number(t.value);if(t.value.trim()===''||!isFinite(v))v=Number($('#ctl-pct').value);answer(clamp(Math.round(v),0,100))}
  else{let v=Number($('#ctl-num').value);if(!isFinite(v))v=st.init;answer(clamp(Math.round(v/st.step)*st.step,st.min,st.max))}
}
function answer(v){
  const st=cur.sc.steps[cur.step];cur.answers[st.key]=v;cur.step++;
  if(cur.step<cur.sc.steps.length){renderSteps();renderBar();return}
  const fb=cur.sc.evaluate(cur.answers);fb.score=clamp(fb.score,0,1);cur.fb=fb;cur.done=true;
  recordResult(cur.id,fb);session.n++;session.sum+=fb.score;
  if(cur.sc.table.ring){cur.sc.table.ring.reveal=true;$('#tbl').innerHTML=tableHTML(cur.sc.table)}
  renderAppbar();renderSteps();renderFeedback(true);renderBar();buzz(verdictOf(fb.score));
}
const verdictOf=s=>s>=0.85?'good':s>=0.45?'ok':'miss';
const VLABEL={good:'Correct',ok:'Close',miss:'Leak'};
function renderFeedback(scroll){
  const fb=cur.fb,v=verdictOf(fb.score),L=LESSONS[cur.id];
  const rows=fb.rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n right">${r[2]}</td></tr>`).join('');
  $('#fb').innerHTML=`<div class="panel fb fadein"><div class="fbhead"><span class="verdict ${v}">${VLABEL[v]}</span><span class="mono score">${Math.round(fb.score*100)} / 100</span>${fb.evLoss>0.005?`<span class="mono evl">${sgn(-fb.evLoss)} bb vs the best move</span>`:''}</div>
    ${fb.plain?`<p class="plain">${fb.plain}</p>`:''}
    ${fb.note?`<p class="note">${fb.note}</p>`:''}
    <div class="tblwrap"><table class="cmp"><thead><tr><th></th><th>You</th><th>Correct</th></tr></thead><tbody>${rows}</tbody></table></div>
    <pre class="math">${fb.math}</pre>${fb.extra||''}
    <div class="lesson"><div class="eyebrow">Rule of thumb · ${L.t}</div><p>${L.s}</p></div>
    <div class="dealres" id="dealres"></div></div>`;
  annotate($('#fb .fb'));
  if(scroll){const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,top=$('#fb').getBoundingClientRect().top+window.scrollY-appbar.offsetHeight-8;window.scrollTo({top,behavior:reduce?'auto':'smooth'})}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!pop.hidden){hidePop();return}
  if(!cur||e.altKey||e.ctrlKey||e.metaKey)return;const tg=e.target;
  if(e.key==='Enter'){if(tg&&tg.tagName==='BUTTON')return;if(cur.done){e.preventDefault();nextHand()}else if(actionbar.querySelector('#lock')){e.preventDefault();lockStep()}return}
  if(!cur.done&&/^[1-6]$/.test(e.key)&&!(tg&&tg.tagName==='INPUT'&&tg.type==='number')){const st=cur.sc.steps[cur.step];if(st&&st.kind==='choice'){const o=st.options[Number(e.key)-1];if(o)answer(o[0])}}
});

function sparkSVG(){
  const lg=state.log;if(lg.length<2)return '<p class="muted">Play a few hands to see your trend.</p>';
  const W=640,H=150,pl=34,pr=8,pt=10,pb=24,pts=[];
  for(let i=0;i<lg.length;i++){const a=Math.max(0,i-19),sl=lg.slice(a,i+1);pts.push(sl.reduce((s,x)=>s+x.s,0)/sl.length)}
  const x=i=>pl+(W-pl-pr)*(lg.length===1?0:i/(lg.length-1)),y=v=>pt+(H-pt-pb)*(1-v/100);
  let g='';for(const v of [0,50,100])g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`;
  const line=pts.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${pl},${y(0)} ${line} ${x(pts.length-1).toFixed(1)},${y(0)}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rolling average score">${g}<polygon points="${area}" fill="var(--accent)" fill-opacity=".10"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="var(--accent)"/><text x="${(pl+W-pr)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">Hands played, oldest to newest (last ${lg.length})</text></svg>`;
}
function renderProgress(){
  const ds=Object.values(state.drills),N=totalN(state),last=state.log.slice(-50),la=last.length?Math.round(last.reduce((a,b)=>a+b.s,0)/last.length):null;
  const evN=ds.reduce((a,d)=>a+d.evN,0),evS=ds.reduce((a,d)=>a+d.ev,0),eN=ds.reduce((a,d)=>a+d.estN,0),eS=ds.reduce((a,d)=>a+d.estSig,0),eA=ds.reduce((a,d)=>a+d.estAbs,0);
  let h=`<div class="screenhead"><h2>Progress</h2></div><div class="tiles">
    <div class="tile"><b>${N}</b><span>Hands played</span></div>
    <div class="tile"><b>${la!=null?la+'%':'—'}</b><span>Average score, last ${last.length||50} hands</span></div>
    <div class="tile"><b>${evN?n1(evS/evN)+' bb':'—'}</b><span>EV given up per decision (call/fold spots, vs the best move)</span></div>
    <div class="tile"><b>${eN?(eS/eN>=0?'+':'−')+n1(Math.abs(eS/eN)):'—'}</b><span>Estimate bias, percentage points (+ = you guess high); average miss ${eN?n1(eA/eN):'—'} pts</span></div></div>
    <section class="panel"><div class="eyebrow">Score trend · rolling 20-hand average, 0–100</div>${sparkSVG()}</section>`;
  const lk=Object.entries(state.leaks).filter(([,L])=>L.s>=0.5).sort((a,b)=>b[1].s-a[1].s).slice(0,6);
  h+=`<section class="panel"><div class="eyebrow">Current leaks · weighted to recent hands</div>`;
  if(!lk.length)h+='<p class="muted">No recurring leaks yet. They appear here when a mistake repeats, and fade as you get the spot right.</p>';
  for(const [t] of lk){const I=leakInfo(t);if(!I)continue;h+=`<div class="leak"><div><b>${I.title}</b><p>${I.desc}</p></div><button class="btn" data-drill="${I.drill}">Practise</button></div>`}
  h+=`</section><section class="panel"><div class="eyebrow">By drill</div><div class="tblwrap"><table class="dtable"><thead><tr><th>Drill</th><th>Hands</th><th>Recent</th><th>All-time</th></tr></thead><tbody>`;
  for(const d of Object.values(DRILLS)){const s=state.drills[d.id];h+=`<tr><td>${d.name}</td><td class="n">${s?s.n:0}</td><td class="n">${s?Math.round(avgRecent(s)*100)+'%':'—'}</td><td class="n">${s?Math.round(s.sum/s.n*100)+'%':'—'}</td></tr>`}
  h+=`</tbody></table></div></section><p class="muted" id="sync">${syncText}</p><div class="confirm" id="reset"><button class="linkbtn" id="rs1">Reset progress</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-drill]').forEach(b=>b.addEventListener('click',()=>startSession(b.dataset.drill)));
  $('#rs1').addEventListener('click',()=>{$('#reset').innerHTML='<span>Erase every score and leak?</span><button class="btn" id="rsy">Erase</button><button class="linkbtn" id="rsn">Keep</button>';
    $('#rsy').addEventListener('click',()=>{state=freshState();queueSave();render()});$('#rsn').addEventListener('click',()=>render())});
}
function renderGuide(){
  let h=`<div class="screenhead"><h2>Guide</h2></div><section class="panel guidep"><div class="eyebrow">How Felt Lab works</div>
    <p><b>The idea.</b> Every poker decision is a bet on probabilities. A good decision makes money on average, even on the nights it loses; a bad one loses on average, even when it gets lucky. So Felt Lab grades your decision, not the result.</p>
    <p><b>The scoring.</b> Where a choice has a money value, the grade uses EV (expected value): what the choice earns on average if you repeated it thousands of times. Estimates are graded on how close you get. Every amount is in big blinds (bb).</p>
    <p><b>The goal.</b> GTO play is a strategy that cannot be beaten in the long run. Nobody plays it perfectly, but each level builds a piece of it: the odds (Levels 1, 2 and 4), which hands to play (Level 3), and how to bet so you cannot be read (Levels 5 and 6).</p>
    <p><b>The words.</b> Tap any underlined word for a plain-English explanation; every word is also listed below. If you are new, begin with Start here on the Train tab.</p>
    <label class="toggle" for="termtog"><input type="checkbox" id="termtog" ${glossOn?'checked':''}> Underline poker words so I can tap them</label></section>
    <section class="panel"><div class="eyebrow">Words</div><input class="search" id="gsearch" type="search" placeholder="Search, e.g. equity" aria-label="Search words"><dl class="gloss" id="glist">`;
  GC.forEach((c,i)=>{h+=`<div class="gcat eyebrow" data-c="${i}">${c}</div>`;for(const g of GLOSS.filter(x=>x.c===i))h+=`<dt data-c="${i}" data-q="${[g.t,...(g.a||[]),...(g.A||[])].join(' ').toLowerCase()}">${g.t}</dt><dd data-c="${i}">${g.d}</dd>`});
  h+=`</dl><p class="muted" id="gnone" hidden>No word matches that search.</p></section>
    <div class="guidep"><h2 style="font-size:26px">Rules of thumb</h2><p class="muted">Each rule unlocks once you have played its drill.</p></div>`;
  for(const L of LEVELS){
    h+=`<section class="level"><div class="lvhead"><span class="eyebrow">${levelLabel(L.n)}</span><h3>${L.name}</h3></div><div>`;
    for(const d of Object.values(DRILLS).filter(x=>x.level===L.n)){const S=LESSONS[d.id],open=state.seen[d.id];
      let extra='';if(open&&d.id==='rfi')extra=`<p class="muted mono" style="font-size:13px">From the charts in this app: ${Object.keys(RFI).map(p=>`${p} ${pct0(rangePct(RFI[p]))}`).join(' · ')}</p>`;
      h+=`<div class="rule ${open?'':'lockedrule'}"><h3>${S.t}</h3>${open?`<p>${S.b}</p>${extra}`:`<p class="muted">Play <b>${d.name}</b> to unlock.</p>`}</div>`}
    h+='</div></section>';
  }
  app.innerHTML=h;
  app.querySelectorAll('.guidep p, .rule').forEach(annotate);
  $('#termtog').addEventListener('change',e=>{glossOn=e.target.checked;try{localStorage.setItem('feltlab.terms',glossOn?'on':'off')}catch(er){}render()});
  $('#gsearch').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase(),vis={};let any=false;
    app.querySelectorAll('#glist dt').forEach(dt=>{const show=!q||dt.dataset.q.includes(q)||dt.nextElementSibling.textContent.toLowerCase().includes(q);dt.hidden=!show;dt.nextElementSibling.hidden=!show;if(show){vis[dt.dataset.c]=1;any=true}});
    app.querySelectorAll('#glist .gcat').forEach(c=>{c.hidden=!vis[c.dataset.c]});$('#gnone').hidden=any;
  });
}
render();initRemote();
</script>
